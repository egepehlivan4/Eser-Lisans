services:
  db:
    image: postgres:18
    container_name: eserlisans_db
    environment:
      POSTGRES_USER: eserlisans
      POSTGRES_PASSWORD: gelistirme_sifresi
      POSTGRES_DB: eserlisans
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eserlisans -d eserlisans"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
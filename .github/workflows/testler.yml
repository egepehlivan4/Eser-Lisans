# Her pull request'te ve main dalına her gönderimde testleri çalıştırır.
# Bir parça (backend/ ya da frontend/) depoda henüz yoksa o adımlar atlanır.
name: Testler

on:
  pull_request:
  push:
    branches: [main]

jobs:
  arka-uc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - id: var
        working-directory: .
        run: echo "var=$([ -f backend/requirements.txt ] && echo evet || echo hayir)" >> "$GITHUB_OUTPUT"
      - if: steps.var.outputs.var == 'evet'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - if: steps.var.outputs.var == 'evet'
        run: pip install -r requirements.txt
      - name: pytest (test kapsamı raporuyla)
        if: steps.var.outputs.var == 'evet'
        # 5 = henüz hiç test yok; ilk sprintlerde hata sayılmaz
        run: python -m pytest -q --cov=app --cov-report=term || [ $? -eq 5 ]

  on-yuz:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - id: var
        working-directory: .
        run: echo "var=$([ -f frontend/package.json ] && echo evet || echo hayir)" >> "$GITHUB_OUTPUT"
      - if: steps.var.outputs.var == 'evet'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.var.outputs.var == 'evet'
        run: npm ci
      - name: Tip kontrolü ve derleme
        if: steps.var.outputs.var == 'evet'
        run: npm run build
